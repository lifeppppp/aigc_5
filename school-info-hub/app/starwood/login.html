<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>星木 · 登录</title>
<style>
  :root{--paper:#fffcf5;--ink:#303d3b;--muted:#8a8272;--line:#d8cdb4;--accent:#486755;--warn:#8a4f28}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:radial-gradient(120% 90% at 20% 0%,#20304a 0%,#16233a 55%,#101a2c 100%);
       font:14px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.5;
         background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent 60%),
                          radial-gradient(1px 1px at 70% 20%,#fff6,transparent 60%),
                          radial-gradient(1.5px 1.5px at 45% 70%,#fff7,transparent 60%),
                          radial-gradient(1px 1px at 85% 60%,#fff5,transparent 60%),
                          radial-gradient(1px 1px at 10% 80%,#fff4,transparent 60%);
         animation:twinkle 7s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.35}to{opacity:.65}}
  .card{position:relative;width:100%;max-width:420px;background:var(--paper);border-radius:10px;
        padding:34px 30px 26px;box-shadow:0 24px 60px #0007,0 0 0 1px #0002}
  .mark{font:11px/1 ui-monospace,monospace;letter-spacing:3px;color:var(--muted)}
  h1{font:28px/1.3 "SimSun",serif;margin:10px 0 4px;color:var(--ink)}
  .sub{color:var(--muted);font-size:12px;margin:0 0 20px}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px 10px;
               font:13px/1 inherit;color:var(--muted);cursor:pointer}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
        background:#fffdf7;color:var(--ink);font:14px/1.4 inherit}
  input:focus{outline:2px solid #48675533;border-color:var(--accent)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .err{min-height:20px;color:var(--warn);font-size:12px;margin-top:12px}
  .go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:5px;background:var(--accent);
      color:#f6f0df;font:14px/1 inherit;letter-spacing:2px;cursor:pointer}
  .go:disabled{opacity:.6;cursor:progress}
  .foot{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);
        font-size:11px;color:var(--muted);line-height:1.9}
  .foot a{color:var(--accent)}
  .plain{background:#f7ecd9;border:1px solid #e0c9a4;border-radius:5px;padding:9px 12px;
         font-size:11px;color:#7a5a2f;margin-top:16px;line-height:1.8}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="card">
  <div class="mark">STARWOOD · 星木</div>
  <h1 id="title">进来，慢慢生长。</h1>
  <p class="sub">一人一个账号。登录后情报、授权、日历都是你自己的，组员之间互不可见。</p>

  <div class="tabs" role="tablist">
    <button id="tabLogin" class="on" type="button" role="tab" aria-selected="true">登录</button>
    <button id="tabReg" type="button" role="tab" aria-selected="false">注册新账号</button>
  </div>

  <form id="form" novalidate>
    <label for="u">用户名</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
           placeholder="小写字母开头，3-24 位" required>
    <div id="regOnly" hidden>
      <label for="n">显示名（可留空）</label>
      <input id="n" name="label" autocomplete="nickname" placeholder="例如：潘辰嘉">
      <div class="hint">显示名只用于情报页和授权页上称呼你，不影响登录。</div>
    </div>
    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password"
           placeholder="至少 8 位" required>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button class="go" id="submit" type="submit">登 录</button>
  </form>

  <div class="foot">
    登录后会自动回到你刚才那一页，情报页签直接就是你的。<br>
    想让「烁」读到课表与校园卡，再花一分钟到右上角 <b>校园令牌</b> 绑一次杭电助手个人令牌（每人自己的，只存本浏览器）。<br>
    星木需先登录：一人一个账号，组员之间互不可见。
  </div>
  <div class="plain">当前是 HTTP 明文连接，密码在传输途中没有加密。请不要使用你在其他网站用过的密码。</div>
</main>
<script>
(() => {
  const ECS = '8.136.148.250';
  const host = location.hostname;
  const API = `http://${!host || host === '127.0.0.1' || host === 'localhost' ? ECS : host}:8020`;
  const $ = s => document.querySelector(s);
  const errBox = $('#err'), form = $('#form'), submit = $('#submit');
  let mode = 'login';

  function render() {
    const reg = mode === 'reg';
    $('#tabLogin').classList.toggle('on', !reg);
    $('#tabReg').classList.toggle('on', reg);
    $('#tabLogin').setAttribute('aria-selected', String(!reg));
    $('#tabReg').setAttribute('aria-selected', String(reg));
    $('#regOnly').hidden = !reg;
    $('#title').textContent = reg ? '第一次来，先占个名字。' : '进来，慢慢生长。';
    $('#p').autocomplete = reg ? 'new-password' : 'current-password';
    submit.textContent = reg ? '注 册' : '登 录';
    errBox.textContent = '';
  }

  $('#tabLogin').onclick = () => { mode = 'login'; render(); $('#u').focus(); };
  $('#tabReg').onclick = () => { mode = 'reg'; render(); $('#u').focus(); };

  function fail(msg) { errBox.textContent = msg; }

  /* 进门闸带进来的 next 只认本站 /starwood/ 下的站内路径：
     // 开头会被当成协议相对地址跳到外站，指回 login.html 自己则原地打转 */
  function target() {
    const here = location.pathname.replace(/login\.html$/, '');
    const next = new URLSearchParams(location.search).get('next') || '';
    const ok = next.startsWith('/starwood/') && !next.startsWith('//') && !next.includes('\\')
      && !/login\.html?$/i.test(next);
    if (!ok) return here + '#intel';
    return next.includes('#') ? next : next + '#intel';
  }

  function done(info) {
    localStorage.setItem('sentinel_token', info.token);
    localStorage.setItem('sentinel_login_ts', String(Date.now()));
    localStorage.setItem('sentinel_account', JSON.stringify({
      username: info.username, member: info.member, label: info.label
    }));
    location.replace(target());
  }

  form.onsubmit = async e => {
    e.preventDefault();
    const username = $('#u').value.trim().toLowerCase();
    const password = $('#p').value;
    const label = $('#n').value.trim();
    if (!username) return fail('先填用户名');
    if (!password) return fail('先填密码');
    submit.disabled = true;
    errBox.textContent = '';
    try {
      const path = mode === 'reg' ? '/api/register' : '/api/login';
      const body = mode === 'reg' ? { username, password, label } : { username, password };
      const r = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await r.json(); } catch { /* 网关错误时没有 JSON */ }
      if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
      done(data);
    } catch (err) {
      fail(err.message === 'Failed to fetch'
        ? `连不上情报服务（${API}）：检查网络，或稍后再试`
        : err.message);
      submit.disabled = false;
    }
  };

  render();
  $('#u').focus();
})();
</script>
</body>
</html>
